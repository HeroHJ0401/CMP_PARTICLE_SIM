name: Build macOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build app
        run: pyinstaller --windowed --onefile --name "CMP Particle Pressure Simulator" cmp_particle_pressure_sim_R01.py

      - name: Zip app bundle
        run: |
          cd dist
          zip -r "CMP-Particle-Pressure-Simulator-macOS.zip" "CMP Particle Pressure Simulator.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CMP-Particle-Pressure-Simulator-macOS
          path: dist/CMP-Particle-Pressure-Simulator-macOS.zip
