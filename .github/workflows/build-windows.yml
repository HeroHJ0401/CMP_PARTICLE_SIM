name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --windowed --onefile --name "CMP Particle Pressure Simulator" cmp_particle_pressure_sim_R02.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CMP-Particle-Pressure-Simulator-Windows
          path: dist/CMP Particle Pressure Simulator.exe
