name: Build (Windows + macOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 저장소에서 가장 높은 R번호의 스크립트를 찾아 그 버전을 파일명에 붙인다.
#   예) cmp_particle_pressure_sim_R02.py → "CMP Particle Pressure Simulator R02.exe"
#                                          "CMP Particle Pressure Simulator R02-macOS.zip"
env:
  SCRIPT_GLOB: cmp_particle_pressure_sim_R*.py
  APP_BASE: CMP Particle Pressure Simulator

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      script: ${{ steps.find.outputs.script }}
      version: ${{ steps.find.outputs.version }}
      app_name: ${{ steps.find.outputs.app_name }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        shell: bash
        run: |
          script=$(ls $SCRIPT_GLOB | sort -V | tail -n 1)
          version=$(echo "$script" | sed -E 's/.*_(R[0-9]+)\.py$/\1/')
          echo "script=$script"        >> "$GITHUB_OUTPUT"
          echo "version=$version"      >> "$GITHUB_OUTPUT"
          echo "app_name=$APP_BASE $version" >> "$GITHUB_OUTPUT"
          echo "Building $script as '$APP_BASE $version'"

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artifact: dist/*.exe
          - os: macos-latest
            label: macOS
            artifact: dist/*-macOS.zip
    runs-on: ${{ matrix.os }}
    env:
      APP_NAME: ${{ needs.meta.outputs.app_name }}
      SCRIPT: ${{ needs.meta.outputs.script }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build
        shell: bash
        run: pyinstaller --windowed --onefile --name "$APP_NAME" "$SCRIPT"

      - name: Zip app bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dist
          zip -r "$APP_NAME-macOS.zip" "$APP_NAME.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.meta.outputs.app_name }} (${{ matrix.label }})
          path: ${{ matrix.artifact }}
          if-no-files-found: error
